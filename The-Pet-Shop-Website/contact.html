<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact The Pet Shop with questions about pets, supplies, and animal care.">
    <title>Contact - The Pet Shop</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>

        <h1>Contact The Pet Shop</h1>
    </header>

    <main>
        <section>
            <h2>Send Us a Message</h2>
            <p>Complete the form below and we will be happy to help.</p>

            <form action="#" method="post">
                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="6" cols="40" required></textarea>
                </p>

                <p>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Sign me up for The Pet Shop newsletter.</label>
                </p>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 The Pet Shop</p>
    </footer>
</body>
</html>
